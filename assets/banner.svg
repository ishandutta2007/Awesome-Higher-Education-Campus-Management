<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01" />
    </linearGradient>

    <!-- Filter for soft glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#gridGrad)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    /* Animated floating background elements */
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .bg-orb-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .bg-orb-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashCycle 15s linear infinite;
    }
    .pill-group-1 {
      animation: floatPill 5s ease-in-out infinite;
    }
    .pill-group-2 {
      animation: floatPill 6s ease-in-out infinite 1s;
    }
    .pill-group-3 {
      animation: floatPill 5.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="bg-orb-1" cx="220" cy="120" r="160" fill="url(#orbGrad1)" />
  <circle class="bg-orb-2" cx="980" cy="280" r="180" fill="url(#orbGrad2)" />

  <!-- Animated Background Network Flow Lines (behind text) -->
  <path class="flow-line" d="M 50 340 C 300 370, 450 310, 650 350 S 950 380, 1150 320" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />
  <path class="flow-line" d="M 100 80 C 350 40, 550 120, 800 60 S 1050 110, 1150 70" fill="none" stroke="#c084fc" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Subtle Campus Vector Architectural Accent (Right Foreground) -->
  <g opacity="0.18" transform="translate(930, 90)">
    <!-- Classical University Portico / Campus Silhouette -->
    <path d="M 0 160 L 220 160 M 20 160 L 20 60 M 70 160 L 70 60 M 110 160 L 110 60 M 150 160 L 150 60 M 200 160 L 200 60 M 10 60 L 210 60 M 110 10 L 0 60 L 220 60 Z" 
          fill="none" stroke="#60a5fa" stroke-width="2" />
    <circle cx="110" cy="40" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 110 33 L 110 47 M 103 40 L 117 40" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Content Container (Foreground: Left & Center-aligned) -->
  <g transform="translate(80, 0)">
    <!-- Top Badge Pill -->
    <g transform="translate(0, 52)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="15" r="4" fill="#10b981" />
      <text x="30" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
        CURATED HIGHER ED ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Higher Education &amp; Campus Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="174" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      Enterprise SaaS &amp; Self-Hosted Open-Source Student Information Systems
    </text>

    <!-- Description / Tagline -->
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      A comprehensive landscape of SIS, campus ERPs, academic scheduling, and institutional tools.
    </text>

    <!-- Interactive / Dynamic Foreground Feature Pills -->
    <g transform="translate(0, 252)">
      <!-- Pill 1 -->
      <g class="pill-group-1" transform="translate(0, 0)">
        <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="18" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
          🎓 Student Information (SIS)
        </text>
      </g>

      <!-- Pill 2 -->
      <g class="pill-group-2" transform="translate(225, 0)">
        <rect width="200" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="18" y="26" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
          🏛️ Enterprise Campus ERP
        </text>
      </g>

      <!-- Pill 3 -->
      <g class="pill-group-3" transform="translate(440, 0)">
        <rect width="235" height="42" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="18" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
          💻 Open-Source &amp; Self-Hosted
        </text>
      </g>

      <!-- Pill 4 -->
      <g class="pill-group-1" transform="translate(690, 0)">
        <rect width="185" height="42" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
        <text x="18" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
          📊 Transparent Pricing
        </text>
      </g>
    </g>

    <!-- Footer Specs Bar -->
    <g transform="translate(0, 335)">
      <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
      <text x="0" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
        RESEARCH-GRADE METRICS • VALUATION BENCHMARKS • VERIFIED GITHUB STAR COUNTS • EDTECH INTELLIGENCE
      </text>
    </g>
  </g>
</svg>
